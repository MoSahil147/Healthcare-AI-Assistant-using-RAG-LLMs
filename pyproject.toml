[project]
name = "healthcare-ai-assistant"
version = "1.0.0"
description = "RAG-based healthcare AI assistant with agentic workflow"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.138.0",
    "starlette==1.3.1",
    "uvicorn[standard]==0.49.0",
    "python-multipart==0.0.32",
    "aiofiles==25.1.0",
    "chromadb==1.5.9",
    "langchain==1.3.10",
    "langchain-chroma==1.1.0",
    "langchain-core==1.4.8",
    "langchain-text-splitters==1.1.2",
    "langchain-huggingface==1.2.2",
    "langchain-groq==1.1.3",
    "groq==0.37.1",
    "sentence-transformers==5.6.0",
    "transformers==5.12.1",
    "torch==2.12.1",
    "accelerate==1.14.0",
    "huggingface-hub==1.20.1",
    "slowapi==0.1.10",
    "tenacity==9.1.4",
    "python-dotenv==1.2.2",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "httpx2==2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx2==2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
