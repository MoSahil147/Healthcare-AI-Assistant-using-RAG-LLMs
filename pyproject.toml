[project]
name = "healthcare-ai-assistant"
version = "1.0.0"
description = "RAG-based healthcare AI assistant with agentic workflow"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "chromadb",
    "sentence-transformers",
    "transformers",
    "torch",
    "accelerate",
    "python-dotenv",
    "pydantic",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
